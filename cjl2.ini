ruleset=🎯 全球直连,clash-classic:https://fastly.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Steam_CDN_Classical_IP.yaml,28800
ruleset=🍀 SkypeTeams,clash-classic:https://fastly.jsdelivr.net/gh/cjllin/clash@main/skype.yaml,28800
ruleset=🚀 手动选择,clash-classic:https://fastly.jsdelivr.net/gh/cjllin/clash@main/ProxyLite.yaml,28800
;本项目收录的直连规则
ruleset=🎯 全球直连,clash-domain:https://fastly.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Domain.yaml,28800
ruleset=🎯 全球直连,clash-classic:https://fastly.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Direct_Classical_IP.yaml,28800
;本项目收录的代理规则
;ruleset=🚀 手动选择,clash-domain:https://fastly.jsdelivr.net/gh/Aethersailor/Custom_OpenClash_Rules@main/rule/Custom_Proxy_Domain.yaml,28800
