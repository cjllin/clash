[custom]
;规则集沿用 Custom_OpenClash_Rules 的 cfg/Custom_Clash.ini
;节点集沿用 cjl-backup.txt 的 🚀 节点选择 体系

;设置规则标志位
;以下规则，按照从上往下的顺序遍历，优先命中上位规则，规则重复无影响
;修改顺序会影响分流效果

;本地地址和域名直连
ruleset=🎯 全球直连,clash-domain:https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/private.mrs
ruleset=🎯 全球直连,clash-ipcidr:https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geoip/private.mrs,86400|no-resolve
;规则集下载域名走直连，避免内核启动时下载规则集被错误分流（EOF）
ruleset=🎯 全球直连,[]DOMAIN-SUFFIX,jsdelivr.net
;cjllin 库规则（沿用 cjl-backup）
ruleset=🍀 VSOL,clash-classic:https://fastly.jsdelivr.net/gh/cjllin/clash@main/vsol.yaml,28800
ruleset=🌍 远程软件,clash-classic:https://fastly.jsdelivr.net/gh/cjllin/clash@main/remote.yaml,28800
ruleset=🎯 全球直连,clash-classic:https://fastly.jsdelivr.net/gh/cjllin/clash@main/Direct.yaml,28800
ruleset=🎮 Steam,clash-domain:https://fastly.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/steam.mrs
;Steam 下载 CDN 直连
